name: Android APK

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  apk:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: android/vendor/node
          key: android-node-24.22.2-${{ runner.os }}-${{ hashFiles('scripts/prepare-android-runtime.py') }}
      - name: Install dependencies
        run: |
          rm -f .npmrc
          pnpm install --frozen-lockfile
      - name: Build debug APK
        if: ${{ !inputs.release }}
        run: pnpm build:android
      - name: Build signed release APK
        if: ${{ inputs.release }}
        env:
          RELEASE_TAG: ${{ inputs.ref }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/splayer-next-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 校验标签并仅使用仓库配置的稳定签名密钥
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "缺少 ANDROID_KEYSTORE_BASE64"; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          pnpm build:android:release
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/android/*.apk
      - name: Native playback tests and Android lint
        run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-android-arm64-v8a
          path: dist/android/*.apk
          if-no-files-found: error
